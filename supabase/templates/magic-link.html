<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="font-family: system-ui, sans-serif; background: #f8fafc; margin: 0; padding: 24px">
    <div
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        padding: 28px;
        border: 1px solid #e2e8f0;
      ">
      <h2 style="color: #4f46e5; margin: 0 0 12px; font-size: 20px">ExpTrack verification code</h2>
      <p style="color: #334155; line-height: 1.6; margin: 0 0 20px">
        Enter this 8-digit code in the app to reset your password. It expires in 10 minutes.
      </p>
      <p
        style="
          font-size: 36px;
          font-weight: 700;
          letter-spacing: 10px;
          color: #0f172a;
          margin: 0 0 24px;
          text-align: center;
        ">
        {{ .Token }}
      </p>
      <p style="color: #64748b; font-size: 13px; margin: 0">
        If you did not request this, you can ignore this email.
      </p>
    </div>
  </body>
</html>
